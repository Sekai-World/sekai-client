name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Minimal read-only permissions: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    name: Lint, type-check and test
    runs-on: [self-hosted, linux, x64, rarecloud, sekai-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync dependencies (including dev extras)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: Ruff lint check
        run: uv run --extra dev ruff check .

      - name: Mypy (scoped to core request/client modules)
        run: uv run --extra dev mypy api_client.py shared_client.py utils/ config.py

      - name: Pytest
        run: uv run --extra dev pytest tests/ -q

  verify-push:
    if: github.event_name == 'push'
    name: Lint, type-check and test
    runs-on: [self-hosted, linux, x64, rarecloud, sekai-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync dependencies (including dev extras)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Ruff format check
        run: uv run --extra dev ruff format --check .

      - name: Ruff lint check
        run: uv run --extra dev ruff check .

      - name: Mypy (scoped to core request/client modules)
        run: uv run --extra dev mypy api_client.py shared_client.py utils/ config.py

      - name: Pytest
        run: uv run --extra dev pytest tests/ -q
