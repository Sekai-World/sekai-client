[project]
name = "sekai-client"
version = "0.1.0"
description = "Unofficial API client for Project Sekai feat. Hatsune Miku and related tooling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler",
    "certifi",
    "cffi",
    "charset-normalizer",
    "click",
    "cryptography",
    "deprecated",
    "flask",
    "gitdb",
    "gitpython",
    "idna",
    "itsdangerous",
    "jinja2",
    "json-rpc",
    "jsonrpcclient",
    "jwcrypto",
    "markupsafe",
    "pycparser",
    "pycryptodome",
    "pyjwt",
    "pytz",
    "pytz-deprecation-shim",
    "pyyaml",
    "requests",
    "setuptools",
    "six",
    "smmap",
    "tzdata",
    "tzlocal",
    "u-msgpack-python",
    "urllib3",
    "werkzeug",
    "wrapt",
    "gunicorn",
    "beautifulsoup4",
    "lxml",
    "ujson",
    "gevent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "mypy>=1.5.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
]

[tool.ruff.lint.mccabe]
max-complexity = 10
