[project]
name = "sekai-client"
version = "0.1.0"
description = "Unofficial API client for Project Sekai feat. Hatsune Miku and related tooling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler",
    "certifi",
    "cffi",
    "charset-normalizer",
    "click",
    "cryptography",
    "deprecated",
    "flask",
    "gitdb",
    "gitpython",
    "idna",
    "itsdangerous",
    "jinja2",
    "json-rpc",
    "jsonrpcclient",
    "jwcrypto",
    "markupsafe",
    "pycparser",
    "pycryptodome",
    "pyjwt",
    "pytz",
    "pytz-deprecation-shim",
    "pyyaml",
    "requests",
    "setuptools",
    "six",
    "smmap",
    "tzdata",
    "tzlocal",
    "u-msgpack-python",
    "urllib3",
    "werkzeug",
    "wrapt",
    "yapf",
    "gunicorn",
    "beautifulsoup4",
    "lxml",
    "ujson",
    "gevent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "mypy>=1.5.0",
    "black>=23.9.0",
    "ruff>=0.0.292",
    "isort>=5.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --cov=. --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

